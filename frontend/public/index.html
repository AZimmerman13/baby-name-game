<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Stork Pool - Create fun baby name, sex, and birthday guessing pools! Perfect for baby showers, office pools, and family betting games. Free baby pool app with scoring and leaderboards."
    />
    <meta name="keywords" content="baby name pool, baby shower game, baby betting pool, baby guessing game, sex reveal pool, baby birthday pool, baby name contest, baby predictions, pregnancy pool" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://storkpool.com/" />
    <meta property="og:title" content="Join my pool on StorkPool" />
    <meta property="og:description" content="Make your guess for the baby's name, birth date, and more! Join the pool and see how your predictions stack up." />

    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://storkpool.com/" />
    <meta property="twitter:title" content="Join my pool on StorkPool" />
    <meta property="twitter:description" content="Make your guess for the baby's name, birth date, and more! Join the pool and see how your predictions stack up." />

    <title>Stork Pool - Baby Name & Sex Guessing Pools</title>
    <style>
      * {

        padding: 0;
        box-sizing: border-box;

        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;

  </head>
  <body>
